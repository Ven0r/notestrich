user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # HTTP Server Block
    server {
        listen 8080;  # Map to internal Docker HTTP port
        server_name notestrich.com;

        # Serve static files or act as a fallback for non-HTTPS traffic
        root /usr/share/nginx/html;

        location / {
            try_files $uri /index.html;
        }

        # Error pages
        error_page 404 /404.html;
        location = /404.html {
            internal;
        }

        # Additional security headers (optional)
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";
    }

    # HTTPS Server Block
    server {
        listen 8443 ssl;  # Map to internal Docker HTTPS port
        server_name notestrich.com;

        ssl_certificate /etc/certs/notestrich.com.crt;
        ssl_certificate_key /etc/certs/notestrich.com.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        root /usr/share/nginx/html;

        location / {
            try_files $uri /index.html;
        }

        # Error pages
        error_page 404 /404.html;
        location = /404.html {
            internal;
        }

        # Additional security headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";
    }
}
